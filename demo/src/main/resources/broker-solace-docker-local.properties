# Local Solace PubSub+ software broker running in Docker - used automatically
# by DemoApp when run with no arguments. Start the container first (see
# README.md, "Local broker for testing"):
#
#   docker run -d --name mend-a-broker-solace \
#     -p 8080:8080 -p 5672:5672 -p 5550:5550 \
#     --shm-size=1g \
#     --env username_admin_globalaccesslevel=admin \
#     --env username_admin_password=admin \
#     solace/solace-pubsub-standard
#
# Broker Manager UI once it's up: http://localhost:8080 (admin/admin)
#
# The broker's default Message VPN ("default") accepts client-username
# "default" with password "default" out of the box - the same defaults the
# Solace Try-Me CLI (stm) relies on - so no extra setup is needed beyond
# starting the container.
broker.type=SOLACE_SELF_MANAGED
broker.host=localhost
broker.port=5672
broker.tls=false
broker.username=default
broker.password=default
broker.messageVpn=default
broker.appendVpnToUsername=false
broker.connectTimeoutMs=5000
